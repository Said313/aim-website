name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/configure-pages@v5
        id: pages
      - run: bun install --frozen-lockfile
      - name: Build and check the static website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bun run build:pages
          for page in index.html en/index.html ru/index.html kz/index.html sitemap.xml \
            aim-feedback/support/index.html aim-feedback/privacy/index.html aim-feedback/terms/index.html; do
            test -s "dist/client/$page"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
